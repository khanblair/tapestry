services:
  backend:
    build:
      context: .. # repo root -- backend/Dockerfile also needs personas/ and skills/, siblings of backend/
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - tapestry-data:/app/data
      # Bind-mounted from the host, not baked into the image: persona edits
      # made through the running app (core.personas.save_persona, via the
      # web adapter's create/update endpoints) write back to these YAML
      # files. Without this mount those writes would land on the
      # container's own ephemeral filesystem layer and vanish on recreate.
      - ../personas:/app/personas
      - ../skills:/app/skills
      - ${TAPESTRY_WORKSPACE_ROOT}:/workspace
      - ~/.gitconfig:/root/.gitconfig:ro
      # macOS Docker Desktop's ssh-agent forwarding socket — commits/pushes from inside the
      # container use the host's real SSH identity, per the git-credentials setup note in
      # project_structure.md's Docker section
      - /run/host-services/ssh-auth.sock:/ssh-agent
    environment:
      TAPESTRY_DB_PATH: /app/data/tapestry.sqlite
      TAPESTRY_CHECKPOINT_PATH: /app/data/tapestry_checkpoints.sqlite
      TAPESTRY_WORKSPACE_ROOT: /workspace
      SSH_AUTH_SOCK: /ssh-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL is what the BROWSER uses (published port on the
      # host) -- the Docker-internal "backend" hostname doesn't resolve
      # from outside the Compose network. INTERNAL_API_URL is what
      # server-rendered pages use instead, from inside this container --
      # see web/lib/api.ts's own comment for the full explanation. Setting
      # NEXT_PUBLIC_API_URL to the internal hostname (as this file
      # previously did) broke every browser-side fetch.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  tapestry-data:
