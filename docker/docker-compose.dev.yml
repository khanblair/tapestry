# Dev stack: bind-mounted source, live code changes, no rebuild required
# between edits. Use this day-to-day; `docker-compose.yml` (the production
# multi-stage build) is for testing the real deploy artifact, not iteration.
#
#   docker compose -f docker/docker-compose.dev.yml up
#   docker compose -f docker/docker-compose.dev.yml up --build   # only after
#     changing pyproject.toml/package.json — new deps need reinstalling
#
# Editing backend/tapestry/**/*.py, personas/*.yaml, skills/**/*.md, or
# web/app|components|lib/**/*.tsx: no rebuild, no restart even for the web
# side (Next.js Fast Refresh). The backend process itself still needs a
# container restart to pick up a change — Python has no general-purpose
# hot-reload for an arbitrary multi-adapter asyncio app —
# `docker compose -f docker/docker-compose.dev.yml restart backend` is
# instant, no image rebuild, unlike the prod compose file's
# rebuild-required workflow this was written to replace.

name: tapestry

services:
  backend:
    build:
      context: .. # repo root -- backend/Dockerfile.dev also needs personas/ and skills/
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ../.env
    ports:
      - "8420:8420"
    volumes:
      # Mirrors backend/Dockerfile's host-layout comment: /app plays the
      # role of the repo root inside the container, so these three mounts
      # land at /app/backend, /app/personas, /app/skills exactly like the
      # image's own COPY layout — required for tapestry/graph/build.py's
      # and web_adapter/api.py's __file__-relative path resolution to find
      # the right directories (see backend/Dockerfile's comment for why).
      - ../backend:/app/backend
      - /app/backend/.venv # anonymous volume: keeps installed deps out of the bind mount
      - ../personas:/app/personas
      - ../skills:/app/skills
      - tapestry-dev-data:/app/data
      - ${TAPESTRY_WORKSPACE_ROOT}:/workspace
      - ~/.gitconfig:/root/.gitconfig:ro
      - /run/host-services/ssh-auth.sock:/ssh-agent
    environment:
      TAPESTRY_DB_PATH: /app/data/tapestry.sqlite
      TAPESTRY_CHECKPOINT_PATH: /app/data/tapestry_checkpoints.sqlite
      TAPESTRY_WORKSPACE_ROOT: /workspace
      SSH_AUTH_SOCK: /ssh-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    ports:
      - "3200:3200"
    volumes:
      - ../web:/app
      - /app/node_modules # anonymous volume: same trick, for pnpm's install
      - /app/.next # anonymous volume: Next's own build cache, not host-shared
    environment:
      # INTERNAL_API_URL is what server-rendered pages use, read from
      # inside this container -- "localhost" there is this container's own
      # loopback, not the backend container. Without this, every
      # server-rendered page (the roster sidebar, the conversation view)
      # silently fell back to lib/mockData.ts's fixtures, since their
      # fetch to the backend simply failed.
      #
      # The BROWSER deliberately gets no NEXT_PUBLIC_API_URL here: it
      # derives the API's address at runtime from whatever host the page
      # was loaded from (see web/lib/api.ts's resolveApiUrl()), so the
      # same built image works from localhost, a LAN IP, or a Tailscale
      # hostname on a phone -- no per-device config.
      INTERNAL_API_URL: http://backend:8420
    depends_on:
      - backend

volumes:
  tapestry-dev-data:
