[project]
name = "tapestry"
version = "0.1.0"
description = "Multi-persona AI workspace across Discord, Telegram, and the web"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "litellm==1.101.0",
    "openhands-sdk==1.44.1",
    "openhands-tools==1.44.1",
    "mcp>=1.2.0",
    "discord.py>=2.4.0",
    "python-telegram-bot==22.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tapestry"]
